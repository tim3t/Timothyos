# TimothyOS: test every push, and publish the app only when the tests pass.
#
# Before this (to 2.76.1) GitHub Pages published the main branch as it stood, within a minute of a push, whether or
# not anything had been tested. Now Pages is fed from here (repository Settings -> Pages -> Source: GitHub Actions):
# a push to main runs the whole suite, and only a green run publishes tools/build_site.py's folder (the app's own
# files; notes, tests, tools and the bridge's code are not published). A red run publishes nothing: the iPads keep
# the last good version.
#
# Third-party actions are pinned to a full commit, not a tag, so a moved tag can't change what runs here.
# No secrets are used. The token can read the repository; only the deploy job may publish.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 2026-11-13 (the diagnostic's finding 1): once a week even when nothing is pushed. It tests and never publishes. It
  # keeps the ffmpeg copy in use (GitHub drops a cache nobody reads for 7 days) and runs the suite as of 60 days from
  # now, so a test that the calendar is about to break shows up weeks before a release meets it (D79). A failure is
  # emailed by GitHub to whoever last changed this schedule. GitHub pauses a schedule after 60 days without a push.
  schedule:
    - cron: '23 10 * * 1'   # Mondays 10:23 UTC (04:23 in Chicago)

permissions:
  contents: read

# One run per branch at a time. A newer push waits for the one running (and replaces any other still waiting).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Chromium alone, without --with-deps: the runner image already carries every library Chromium needs, and
      # --with-deps only added nine font packages the app never uses (it serves its own fonts). ffmpeg is the one
      # system package the tests need (the simulated NAS makes its sample audio and video with it).
      #
      # ffmpeg comes from a copy kept by GitHub's own cache whenever there is one (Timothy's choice, 11 Nov 2026,
      # after Ubuntu's package server was unreachable from GitHub's runners for hours): the .deb files Ubuntu served
      # on the last good install, installed with dpkg, no network needed. Without a copy, or if the copy no longer
      # installs (a new runner image), it installs from Ubuntu as before and keeps the files for next time. Short
      # network timeouts and a 12-minute limit: an outage fails the run in minutes, and nothing is published.
      - name: Restore the kept copy of ffmpeg
        id: ffcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-ubuntu-24.04-v1
      - name: Test tooling (Playwright at the version in package-lock.json, Chromium, ffmpeg)
        id: tooling
        timeout-minutes: 12
        run: |
          npm ci
          npx playwright install chromium
          from_copy=no
          if [ -n "$(ls ~/ffmpeg-debs/*.deb 2>/dev/null)" ] && sudo dpkg -i ~/ffmpeg-debs/*.deb >/dev/null 2>dpkg.err && ffmpeg -version >/dev/null 2>&1; then
            from_copy=yes; echo "ffmpeg installed from the kept copy ($(ls ~/ffmpeg-debs/*.deb | wc -l) packages)."
          else
            [ -s dpkg.err ] && { echo "The kept copy did not install; installing from Ubuntu instead:"; tail -3 dpkg.err; }
            mkdir -p ~/ffmpeg-debs/partial
            apt_get() { sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Cache::archives="$HOME/ffmpeg-debs" -o APT::Keep-Downloaded-Packages=true "$@"; }
            for try in 1 2 3; do
              if apt_get install -y --no-install-recommends ffmpeg || { apt_get update && apt_get install -y --no-install-recommends ffmpeg; }; then break; fi
              if [ "$try" = 3 ]; then echo "::error::ffmpeg could not be installed: Ubuntu's package server did not answer, and there is no kept copy yet. Re-run this workflow later; nothing was published."; exit 1; fi
              echo "Package server not reachable (try $try of 3). Waiting 30 seconds."; sleep 30
            done
            sudo rm -rf ~/ffmpeg-debs/partial ~/ffmpeg-debs/lock; sudo chown -R "$USER" ~/ffmpeg-debs
          fi
          echo "from_copy=$from_copy" >> "$GITHUB_OUTPUT"
          ffmpeg -version | head -1
      - name: Keep a copy of ffmpeg for runs when Ubuntu's server is down
        if: steps.tooling.outputs.from_copy == 'no' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ffmpeg-debs
          key: ffmpeg-debs-ubuntu-24.04-v1
      - name: Tests
        run: |
          set -o pipefail
          bash tests/run.sh 2>&1 | tee run.log
      # The weekly run only: the same suite as of 60 days from now (faketime; NO_FAKE_STAT keeps file times real, which
      # fix_videos --selftest needs). faketime comes from Ubuntu; if its server is down this check is skipped, not failed.
      - name: The calendar ahead (weekly run only)
        if: github.event_name == 'schedule'
        timeout-minutes: 25
        run: |
          set -o pipefail
          if ! sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends faketime >/dev/null 2>&1 \
             && ! { sudo apt-get update >/dev/null 2>&1 && sudo apt-get install -y --no-install-recommends faketime >/dev/null 2>&1; }; then
            echo "::warning::faketime could not be installed (Ubuntu's package server); the 60-days-ahead check was skipped this week."; exit 0
          fi
          NO_FAKE_STAT=1 FAKETIME_FORCE_MONOTONIC_FIX=1 faketime -f "+60d" bash tests/run.sh 2>&1 | tee ahead.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### TimothyOS tests"
            echo '```'
            if [ -f run.log ]; then grep -E "^(FAIL|ALL PASSED|SOME TESTS FAILED)| browser tests took " run.log || true; else echo "The tests did not start."; fi
            if [ -f ahead.log ]; then echo "As of 60 days from now:"; grep -E "^(FAIL|ALL PASSED|SOME TESTS FAILED)" ahead.log || true; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-screenshots
          path: tests/out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Build the site (the app's own files only)
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        run: python3 tools/build_site.py _site
      - name: Hand the site to the deploy job
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Until Settings -> Pages -> Source is "GitHub Actions", Pages still publishes the branch itself and would refuse
      # this deploy. Say so and stop quietly, so the switch can be made whenever Timothy is ready.
      - name: Is Pages fed from Actions yet?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "legacy" ]; then
            echo "::notice::Pages still publishes the main branch directly. Switch Settings -> Pages -> Source to GitHub Actions to publish only tested versions."
            echo "Not deployed from here: Pages still publishes the branch directly (Settings -> Pages -> Source)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish
        id: deployment
        if: steps.mode.outputs.mode != 'legacy'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
