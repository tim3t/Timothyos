<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimothyOS</title>
<meta name="description" content="Timothy's life dashboard: the Bridge overview, calendars, priorities and key dates in one place.">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TimothyOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=2.5.3">
</head>
<body>
<div class="app" id="app">
  <button class="elbow" type="button" data-screen="bridge" aria-label="Bridge overview">BRIDGE</button>
  <header class="top">
    <div class="topbar"><span>TIMOTHYOS 2.5</span><span id="topNote">CALENDAR CORE</span><button type="button" class="topbtn" id="idleBtn" aria-label="Standby now: dim to the clock">STANDBY</button></div>
    <div class="headrow">
      <div class="titlegroup">
        <div>
          <div class="eyebrow" id="eyebrow">TODAY</div>
          <h1 id="title">TIMOTHYOS</h1>
        </div>
        <div class="pager" id="pager" hidden>
          <button class="chip back" type="button" id="logBtn" hidden><span class="tri l"></span> ALL REVIEWS</button>
          <button class="chip" type="button" id="prevBtn" aria-label="Previous"><span class="tri l"></span></button>
          <button class="chip" type="button" id="todayBtn">TODAY</button>
          <button class="chip" type="button" id="nextBtn" aria-label="Next"><span class="tri r"></span></button>
        </div>
      </div>
      <div class="actions" aria-label="Coming later">
        <button class="btn plan" type="button" id="planBtn" disabled>PLAN DAY</button>
        <button class="btn ask" type="button" id="askBtn" disabled>ASK</button>
        <button class="btn capture" type="button" id="capBtn">CAPTURE</button>
      </div>
    </div>
  </header>
  <nav class="side" aria-label="Screens">
    <button class="nav navbridge" data-screen="bridge" style="--c: var(--chrome-a)" type="button">BRIDGE</button>
    <button class="nav" data-screen="today" style="--c: var(--chrome-b)" type="button">TODAY</button>
    <button class="nav" data-screen="week" style="--c: var(--chrome-a)" type="button">WEEK</button>
    <button class="nav" data-screen="month" style="--c: var(--chrome-b)" type="button">MONTH</button>
    <button class="nav" data-screen="dates" style="--c: var(--chrome-c)" type="button">DATES</button>
    <button class="nav" data-screen="review" style="--c: var(--chrome-b)" type="button">REVIEW</button>
    <button class="nav" data-screen="ledger" style="--c: var(--chrome-a)" type="button">LEDGER</button>
    <button class="nav" data-screen="log" style="--c: var(--chrome-c)" type="button">LOG</button>
    <div class="fill" aria-hidden="true"></div>
    <button class="status" id="status" type="button" aria-label="Sync status. Opens Systems."></button>
  </nav>
  <main class="content" id="content"></main>
</div>

<div class="scrim capscrim" id="capScrim" hidden>
  <form class="sheet" id="capForm" autocomplete="off" novalidate aria-label="Quick capture" style="--c: var(--personal)">
    <div class="sbar"><span>QUICK CAPTURE</span><span id="capMode">PERSONAL CALENDAR</span></div>
    <div class="sbody">
      <div class="capnote" id="capNote" hidden></div>
      <input type="text" id="capText" maxlength="200" placeholder="What goes in? e.g. Pick up bee feeder" enterkeyhint="done" autocapitalize="sentences">
      <div class="frow"><span>TYPE</span><div class="chips">
        <button type="button" class="chip" data-ctype="event">EVENT</button>
        <button type="button" class="chip" disabled>NOTE<small>STANDBY</small></button>
        <button type="button" class="chip" disabled>PRIORITY<small>STANDBY</small></button>
        <button type="button" class="chip" data-ctype="date" id="capTypeDate">KEY DATE</button>
      </div></div>
      <div class="frow" id="capAreaRow"><span>AREA</span><div class="chips">
        <button type="button" class="chip a-personal" data-carea="personal" aria-pressed="true">PERSONAL</button>
        <button type="button" class="chip a-farm" data-carea="farm" id="capFarm" disabled>FARM + BEES<small>STANDBY</small></button>
        <button type="button" class="chip a-hobby" disabled>HOBBIES<small>STANDBY</small></button>
      </div></div>
      <div class="frow" id="capKdRow" hidden><span>AREA</span><div class="chips">
        <select id="capLifeArea" aria-label="Life Area"></select>
        <select id="capKdType" aria-label="Type"></select>
        <button type="button" class="chip" id="capYearly" aria-pressed="false">YEARLY</button>
      </div></div>
      <div class="frow"><span>DAY</span><div class="chips">
        <button type="button" class="chip" data-capday="today">TODAY</button>
        <button type="button" class="chip" data-capday="tomorrow">TOMORROW</button>
        <input type="date" id="capDate" aria-label="Pick a day">
      </div></div>
      <div class="frow" id="capUntilRow" hidden><span>UNTIL</span><div class="chips">
        <input type="date" id="capUntil" aria-label="End date, for windows">
        <span class="muted" style="font-size:14px">Optional, for windows like a planting season.</span>
      </div></div>
      <div class="frow" id="capTimeRow"><span>TIME</span><div class="chips">
        <select id="capTime" aria-label="Start time"></select>
        <span class="chips" id="capDurs"></span>
      </div></div>
      <div class="err" id="capErr" role="alert"></div>
    </div>
    <div class="sfoot capfoot">
      <span class="muted" id="capFootText">Saves to your Personal Google Calendar. Work is read-only.</span>
      <span class="btnrow">
        <button type="button" class="btn ghost" id="capCancel">CANCEL</button>
        <button type="submit" class="btn capture" id="capSave">SAVE</button>
      </span>
    </div>
  </form>
</div>

<div class="scrim capscrim" id="planScrim" hidden>
  <div class="sheet plansheet" id="planSheet" role="dialog" aria-modal="true" aria-label="Plan Day" style="--c: var(--chrome-c)"></div>
</div>

<div class="scrim capscrim" id="askScrim" hidden>
  <div class="sheet asksheet" id="askSheet" role="dialog" aria-modal="true" aria-label="Ask" style="--c: var(--chrome-a)">
    <div class="sbar"><span>ASK<span class="long"> · SHIP'S COMPUTER</span></span><span id="askMeter"></span></div>
    <div class="sbody">
      <div class="asklog" id="askLog" aria-live="polite"></div>
      <textarea id="askText" rows="2" maxlength="2000" enterkeyhint="send" placeholder="Ask about your days, tasks and dates. Tap the keyboard mic to speak."></textarea>
      <div class="err" id="askErr" role="alert"></div>
    </div>
    <div class="sfoot capfoot">
      <span class="btnrow">
        <button type="button" class="chip" id="askDeep" aria-pressed="false">THINK HARDER</button>
        <button type="button" class="chip" id="askNew">NEW CHAT</button>
        <button type="button" class="chip" id="askOpen">OPEN IN CLAUDE</button>
      </span>
      <span class="btnrow">
        <button type="button" class="btn ghost" id="askClose">CLOSE</button>
        <button type="button" class="btn capture" id="askSend">SEND</button>
      </span>
    </div>
  </div>
</div>

<div class="scrim" id="detailScrim" hidden>
  <div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle"></div>
</div>

<button class="update" id="updateBtn" type="button" hidden>UPDATE READY · TAP TO LOAD</button>
<div class="toast" id="toast" role="status" hidden></div>
<div class="standby" id="standby" hidden aria-label="Standby. Tap anywhere to wake.">
  <div class="sb-body" id="sbBody"></div>
  <span class="sb-hint">TAP ANYWHERE TO WAKE</span>
</div>

<script src="js/app.js?v=2.5.3"></script>
</body>
</html>
